name: simt-core-regression
on: [push, pull_request]
jobs:
  tools-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: make test
      - run: make docs-check
      - run: make mutation-smoke
      - run: git diff --check
